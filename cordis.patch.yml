# 把本插件插进 DSH profile 的配置树（bundle 挂载声明）。
#
# 想改默认等待/轮数/落盘目录，不必改这里：给这条 entry 加 config 即可：
#   - id: dsh-bsk-fetch
#     name: dsh-bsk-fetch
#     config:
#       waitMs: 40000
#       rounds: 6
#       outputDir: 'D:/data/bsk-fetch'
#       # v0.3.0 起（深度合并 dsh-cnki-dl 后）：
#       pythonExe: 'python'   # 知网下载器用的 Python 解释器
#       timeoutMs: 120000     # 单次知网命令超时（毫秒）
#       wantFormat: 'pdf'     # 下载格式：pdf / caj
- insert:
    - id: dsh-bsk-fetch
      name: dsh-bsk-fetch
